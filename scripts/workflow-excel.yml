name: Generar Excel
on:
  push:
    branches: [main, master]
    paths: ['data/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python scripts/generar_excel.py
      - run: |
          git config user.name "terra-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos/Registro_Terra_PSCJ.xlsx
          git diff --cached --quiet || (git commit -m "Actualiza registro Excel" && git push)
